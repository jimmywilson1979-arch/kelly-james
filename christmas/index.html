<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A20">
<meta property="og:type" content="website">
<meta property="og:title" content="A Christmas card for you">
<meta property="og:description" content="Tap to open your card.">
<meta property="og:image" content="https://jimmywilson1979-arch.github.io/kelly-james/christmas/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Christmas Envelope Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one red envelope on a dark pine-green table under falling snow. Tap → it lifts and turns over in 3D →
   gold seal breaks → tartan-lined flap lifts → the photo card rises out and glides up to fill the screen.
   Deliberately single-look (a candlelit Christmas evening). */
:root{
  --table:#132A20; --table-lit:#21463A;
  --env:#9C1D2B; --env-2:#8A1825; --env-3:#7B1421; --env-edge:#62101A;
  --paper:#FBF6EC; --ink:#2A1D17; --ink-soft:#5B4A3F; --cream:#F5ECDC;
  --berry:#B8202F; --holly:#2F5A3A; --holly-2:#22452C; --gold:#D4A645; --gold-hi:#F1D58A; --gold-lo:#9C7424;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Gill Sans','Trebuchet MS',sans-serif;
  --w:min(76vw,330px,calc((100svh - 230px) / 1.4));
  --tartan:
    repeating-linear-gradient(90deg,rgba(212,166,69,.55) 0 1px,transparent 1px 22px,rgba(245,236,220,.35) 22px 24px,transparent 24px 44px),
    repeating-linear-gradient(0deg,rgba(212,166,69,.55) 0 1px,transparent 1px 22px,rgba(245,236,220,.35) 22px 24px,transparent 24px 44px),
    repeating-linear-gradient(90deg,rgba(19,42,32,.75) 0 8px,transparent 8px 22px),
    repeating-linear-gradient(0deg,rgba(19,42,32,.75) 0 8px,transparent 8px 22px),
    #A3202F;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(circle at 10% 14%,rgba(255,196,110,.16) 0 3px,rgba(255,196,110,0) 26px),
  radial-gradient(circle at 88% 22%,rgba(255,196,110,.14) 0 3px,rgba(255,196,110,0) 30px),
  radial-gradient(circle at 18% 84%,rgba(255,196,110,.12) 0 3px,rgba(255,196,110,0) 28px),
  radial-gradient(circle at 92% 78%,rgba(255,196,110,.14) 0 3px,rgba(255,196,110,0) 26px),
  radial-gradient(120% 80% at 50% 35%,var(--table-lit),var(--table) 70%);
  background-color:var(--table);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;z-index:2}
.hint{font-family:var(--serif);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.85;text-align:center}
.tap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.tap i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,166,69,.6)}70%,100%{box-shadow:0 0 0 12px rgba(212,166,69,0)}}

/* ---------- envelope ---------- */
.scene{position:relative;perspective:1400px;animation:float 5s ease-in-out infinite}
.scene.still{animation:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.env{display:block;position:relative;width:var(--w);height:calc(var(--w) * 1.4);cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;transform-style:preserve-3d}
.env:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:6px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d}
.flipper.flat{transform-style:flat}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shadow{position:absolute;left:8%;right:8%;bottom:-3%;height:10%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(14px)}
.front{background:radial-gradient(130% 90% at 30% 20%,#A82232,var(--env) 55%,var(--env-2));display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(0,0,0,.12)}
.front::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%,rgba(0,0,0,.08));pointer-events:none}
.to{font-size:calc(var(--w) * .033);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);opacity:.85}
.names{font-family:var(--script);font-size:calc(var(--w) * .12);line-height:1.15;color:var(--cream);text-align:center;padding:0 9%;margin:6px 0 10px;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rule{width:38%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.from{position:absolute;left:8%;bottom:6%;font-family:var(--script);font-size:calc(var(--w) * .058);color:var(--gold-hi);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprig{position:absolute;right:5%;bottom:3.5%;width:calc(var(--w) * .24);height:auto}
.stamp{position:absolute;top:6%;right:7%;width:calc(var(--w) * .17);aspect-ratio:5/6;padding:5px;background:#fff;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(3deg)}
.stamp::before{content:"";position:absolute;inset:-3px;background:radial-gradient(circle,var(--env) 2.1px,transparent 2.4px) 0 0/6px 6px}
.stamp svg{position:relative;display:block;width:100%;height:100%}
.postmark{position:absolute;top:9%;right:calc(7% + var(--w) * .1);width:calc(var(--w) * .3);height:auto;opacity:.5}

.back{transform:rotateY(180deg);background:var(--env-3)}
.flipper.flat .back{transform:none}
.flipper.flat .front{visibility:hidden}
.inside{position:absolute;inset:0;border-radius:6px;background:var(--tartan);background-size:44px 44px;opacity:.95}
.inside::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 34%)}
.card-in{position:absolute;z-index:2;left:5%;top:5%;width:90%;aspect-ratio:116/166}
.pocket{position:absolute;z-index:3;inset:0;width:100%;height:100%;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.18))}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;transform-origin:50% 0;transform-style:preserve-3d;z-index:5}
.flap .o,.flap .l{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .o{background:linear-gradient(180deg,#A01F2E,var(--env-2))}
.flap .l{background:var(--tartan);background-size:44px 44px;transform:rotateX(180deg);clip-path:polygon(50% 0,100% 100%,0 100%)}
.flap.under{z-index:1}
.seal{position:absolute;left:50%;top:55%;width:calc(var(--w) * .22);aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.seal span{position:absolute;inset:0;border-radius:47% 53% 50% 50% / 52% 48% 52% 48%;background:radial-gradient(circle at 36% 30%,var(--gold-hi),var(--gold) 52%,var(--gold-lo));
  box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:rgba(110,72,14,.6)}
.seal svg{width:56%;height:56%;filter:drop-shadow(0 1px 0 rgba(255,240,200,.45)) drop-shadow(0 -1px 0 rgba(80,50,8,.35))}
.seal .a{clip-path:polygon(0 0,54% 0,46% 38%,57% 61%,45% 100%,0 100%)}
.seal .b{clip-path:polygon(54% 0,100% 0,100% 100%,45% 100%,57% 61%,46% 38%)}

/* ---------- the photo card ---------- */
.cardface{position:absolute;left:0;top:0;width:300px;height:429px;transform-origin:0 0;background:var(--paper);
  border-radius:3px;box-shadow:0 10px 24px -14px rgba(0,0,0,.5);color:var(--ink);text-align:center;overflow:hidden}
.cardface::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);border-radius:2px;pointer-events:none;opacity:.8}
.photo{position:absolute;left:16px;top:16px;width:268px;height:236px;background:var(--photo) center/cover #34405F;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.photo-sprig{position:absolute;left:210px;top:214px;width:86px;height:auto;transform:rotate(-8deg)}
.cf{position:absolute;left:0;right:0;font-family:var(--sans);font-size:8.4px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);line-height:1.85;padding:0 26px}
.cf.script{font-family:var(--script);text-transform:none;letter-spacing:0}
.cf .fit{display:inline-block;white-space:nowrap}
.cf.greet{top:256px;height:52px;display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1.1;color:var(--berry);padding:0 14px;white-space:nowrap;box-sizing:border-box}
.cf.msg{top:310px;text-wrap:balance}
.cf.star{top:345px;height:12px;width:60px;margin:0 auto;padding:0}
.cf.lovefrom{top:362px;font-size:7.6px}
.cf.family{top:374px;font-size:25px;line-height:1.2;color:var(--holly-2);white-space:nowrap;padding:0 18px}
.full{position:fixed;left:0;top:0;z-index:20;transform-origin:0 0;will-change:transform}
.full .cardface{position:relative;transform:none;transition:box-shadow .9s}
.full.settled .cardface{box-shadow:0 30px 60px -24px rgba(0,0,0,.65)}

.actions{position:fixed;left:0;right:0;z-index:21;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));visibility:hidden}
.actions > *{opacity:0}
.actions.on{visibility:visible}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:1.5px solid var(--cream);color:var(--cream);background:transparent;cursor:pointer}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.again{background:none;border:0;color:var(--cream);opacity:.75;font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:12px;cursor:pointer;flex-basis:100%}
.skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:30;background:rgba(0,0,0,.2);border:1px solid rgba(245,236,220,.35);color:var(--cream);border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
body.loading .stage,body.loading .skip{opacity:0;pointer-events:none}
.stage,.skip{transition:opacity .6s}
.note{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:5;text-align:center;font-family:var(--serif);font-size:20px;line-height:1.4;color:var(--cream);padding:0 max(24px,env(safe-area-inset-left,0px))}
.note small{display:block;margin-top:10px;font-family:var(--sans);font-size:13px;letter-spacing:.06em;opacity:.75}
canvas.snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){.tap i,.scene{animation:none}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="holly" viewBox="0 0 120 70">
      <path d="M58 40 C46 30 30 30 14 22 c4 4 2 8 -2 9 c5 2 6 6 3 9 c6 0 8 3 7 7 c5-2 9 0 10 4 c4-4 9-4 12-1 c2-5 7-7 14-10z" fill="#2F5A3A"/>
      <path d="M58 40 C47 32 32 30 16 24" fill="none" stroke="#1D3A26" stroke-width="1.1"/>
      <path d="M62 40 C74 28 90 26 106 16 c-3 5 -1 8 3 9 c-5 2 -5 6 -2 9 c-6 1 -8 4 -6 8 c-5-1 -9 1 -9 5 c-4-3 -9-3 -12 1 c-2-5 -7-7 -14-8z" fill="#3A6B45"/>
      <path d="M62 40 C73 31 88 27 104 19" fill="none" stroke="#24452C" stroke-width="1.1"/>
      <circle cx="56" cy="44" r="6.2" fill="#B8202F"/><circle cx="66" cy="45" r="6.2" fill="#C8303F"/><circle cx="61" cy="36" r="6.2" fill="#A81C2A"/>
      <circle cx="54" cy="42" r="1.8" fill="#fff" opacity=".55"/><circle cx="64" cy="43" r="1.8" fill="#fff" opacity=".55"/><circle cx="59" cy="34" r="1.8" fill="#fff" opacity=".55"/>
    </symbol>
    <symbol id="flake" viewBox="-50 -50 100 100">
      <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
        <path id="arm" d="M0 0 V-42 M0 -26 l-11 -11 M0 -26 l11 -11 M0 -12 l-8 -8 M0 -12 l8 -8"/>
        <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
      </g>
    </symbol>
  </defs>
</svg>

<button class="skip" id="skip" type="button">Skip</button>

<main class="stage" id="stage">
  <div class="hint" id="hintTop">A card for you</div>

  <div class="scene" id="scene">
    <div class="shadow" id="shadow"></div>
    <button class="env" id="env" type="button" aria-label="Open your Christmas card">
      <div class="flipper" id="flipper">
        <!-- front: the addressed side -->
        <div class="face front" id="front">
          <div class="stamp">
            <svg viewBox="0 0 50 60" aria-hidden="true">
              <rect width="50" height="60" fill="#1F4B36"/>
              <circle cx="25" cy="24" r="22" fill="#2A5E45" opacity=".6"/>
              <g fill="#F5ECDC" opacity=".8"><circle cx="8" cy="9" r=".9"/><circle cx="42" cy="12" r="1.1"/><circle cx="12" cy="30" r=".8"/><circle cx="40" cy="34" r=".9"/><circle cx="34" cy="6" r=".7"/></g>
              <path d="M25 9 L36 25 H31 L39 36 H33 L41 47 H9 L17 36 H11 L19 25 H14 Z" fill="#0F2E20"/>
              <rect x="22.5" y="47" width="5" height="5" fill="#5A3A22"/>
              <path d="M25 4.5 l1.6 3.3 3.6.5 -2.6 2.5 .6 3.6 -3.2-1.7 -3.2 1.7 .6-3.6 -2.6-2.5 3.6-.5z" fill="#F1D58A"/>
              <g fill="#D4A645"><circle cx="21" cy="21" r="1.3"/><circle cx="29" cy="28" r="1.3"/><circle cx="19" cy="34" r="1.3"/><circle cx="31" cy="40" r="1.3"/><circle cx="23" cy="43" r="1.3"/></g>
              <g fill="#C8303F"><circle cx="27" cy="18" r="1.2"/><circle cx="22" cy="29" r="1.2"/><circle cx="26" cy="37" r="1.2"/><circle cx="16" cy="43" r="1.2"/><circle cx="35" cy="45" r="1.2"/></g>
              <text x="25" y="57.5" text-anchor="middle" font-family="Jost, sans-serif" font-size="5.2" letter-spacing=".8" fill="#F5ECDC">1ST</text>
            </svg>
          </div>
          <svg class="postmark" viewBox="0 0 120 60" aria-hidden="true">
            <circle cx="88" cy="30" r="24" fill="none" stroke="#F5ECDC" stroke-width="1.6"/>
            <text x="88" y="27" text-anchor="middle" font-family="Jost, sans-serif" font-size="6.6" letter-spacing="1" fill="#F5ECDC">CHRISTMAS</text>
            <text x="88" y="38" text-anchor="middle" font-family="Jost, sans-serif" font-size="6.6" letter-spacing=".6" fill="#F5ECDC" id="pmYear">2026</text>
            <path d="M2 18 q8 -5 16 0 t16 0 t16 0 t12 0 M2 30 q8 -5 16 0 t16 0 t16 0 t12 0 M2 42 q8 -5 16 0 t16 0 t16 0 t12 0" fill="none" stroke="#F5ECDC" stroke-width="1.4"/>
          </svg>
          <div class="to">To</div>
          <div class="names" id="names">Auntie Bethan &amp; Uncle Rhys</div>
          <div class="rule"></div>
          <div class="from" id="fromEnv">from The Pritchards</div>
          <svg class="sprig" viewBox="0 0 120 70" aria-hidden="true"><use href="#holly"/></svg>
        </div>
        <!-- back: flap, seal and the card inside -->
        <div class="face back" id="back">
          <div class="inside"></div>
          <div class="card-in" id="cardIn"></div>
          <svg class="pocket" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="0,0 52,80 0,140" fill="#94192A"/>
            <polygon points="100,0 48,80 100,140" fill="#8B1826"/>
            <polygon points="0,140 50,70 100,140" fill="#A11F2F"/>
            <polyline points="0,140 50,70 100,140" fill="none" stroke="#62101A" stroke-width=".35"/>
          </svg>
          <div class="flap" id="flap"><div class="o"></div><div class="l"></div></div>
          <div class="seal" id="seal">
            <span class="a"><svg aria-hidden="true"><use href="#flake"/></svg></span>
            <span class="b"><svg aria-hidden="true"><use href="#flake"/></svg></span>
          </div>
        </div>
      </div>
    </button>
  </div>

  <div class="tap" id="hintTap"><i></i>Tap to open</div>
</main>

<div class="actions" id="actions">
  <a class="btn primary" id="replyBtn" href="#" target="_blank" rel="noopener">Send a reply</a>
  <a class="btn" id="linkBtn" href="#" target="_blank" rel="noopener" hidden>Visit us</a>
  <button class="again" id="again" type="button">Open it again</button>
</div>

<canvas class="snow" id="snow" aria-hidden="true"></canvas>

<template id="cardTpl">
  <div class="cardface" role="img" aria-label="Christmas card with a family photo">
    <div class="photo"></div>
    <svg class="photo-sprig" viewBox="0 0 120 70" aria-hidden="true"><use href="#holly"/></svg>
    <div class="cf script greet" data-f="greeting">Merry Christmas</div>
    <div class="cf msg" data-f="msg">Wishing you a magical Christmas<br>and a happy, healthy new year</div>
    <svg class="cf star" viewBox="0 0 60 12" aria-hidden="true"><path d="M0 6 H22 M38 6 H60" stroke="#D4A645" stroke-width=".8"/><path d="M30 1 l1.4 3.1 3.4.4 -2.5 2.3 .7 3.4 -3-1.7 -3 1.7 .7-3.4 -2.5-2.3 3.4-.4z" fill="#D4A645"/></svg>
    <div class="cf lovefrom">With love from</div>
    <div class="cf script family" data-f="family">The Pritchard Family</div>
  </div>
</template>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const EASE = { flip: "cubic-bezier(.65,0,.35,1)", out: "cubic-bezier(.22,1,.36,1)", inOut: "cubic-bezier(.45,0,.55,1)", lift: "cubic-bezier(.33,0,.25,1)" };
  const play = (el, frames, opts) => el.animate(frames, { fill: "forwards", easing: EASE.out, ...opts, duration: reduce ? 1 : opts.duration, delay: reduce ? 0 : (opts.delay || 0) });
  const at = (ms, fn) => setTimeout(fn, reduce ? 0 : ms);

  // the card lives inside the envelope until it is pulled out
  const cardIn = $("cardIn");
  let card = card0.cloneNode(true);
  cardIn.appendChild(card);
  const sizeInner = () => { if (card.parentNode === cardIn) card.style.transform = `scale(${(cardIn.getBoundingClientRect().width || 300) / 300})`; };
  sizeInner();

  // long greetings or family names shrink to stay on one line
  const fitLine = (el, min) => {
    let t = el.querySelector("span.fit"); if (!t) { t = document.createElement("span"); t.className = "fit"; t.textContent = el.textContent; el.textContent = ""; el.appendChild(t); }
    el.style.fontSize = ""; let fs = parseFloat(getComputedStyle(el).fontSize);
    const cs = getComputedStyle(el), avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    while (t.offsetWidth * 1.1 > avail && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; } };
  const fitCard = () => { fitLine(card.querySelector('[data-f="greeting"]'), 15); fitLine(card.querySelector('[data-f="family"]'), 15); };
  fitCard(); (document.fonts && document.fonts.ready || Promise.resolve()).then(fitCard);

  // a real card:  ?c=<code>  loads that person's card from the database (and counts the open; &preview=1 doesn't)
  const DB = { url: "https://egducrlyqakscixtnltv.supabase.co", key: "sb_publishable_JiweLKy9DWgTKpfESb1ieQ_iFBN8hP5" };
  const setF = (k, v) => { const el = card.querySelector(`[data-f="${k}"]`); el.textContent = v; el.style.fontSize = ""; };
  function apply(d){
    if (d.to) $("names").textContent = d.to;
    if (d.family) { $("fromEnv").textContent = "from " + d.family; setF("family", d.family); }
    if (d.greeting) setF("greeting", d.greeting);
    if (d.msg) setF("msg", d.msg);
    if (/^https:\/\//.test(d.photo || "")) rootStyle.setProperty("--photo", `url("${d.photo.replace(/["\\]/g, "")}")`);
    $("replyBtn").href = "https://wa.me/" + (d.reply || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(`Thank you for the lovely Christmas card! Merry Christmas to ${d.family || "you"} too`);
    card.setAttribute("aria-label", `Christmas card: ${card.querySelector('[data-f="greeting"]').textContent}, with love from ${card.querySelector('[data-f="family"]').textContent}`);
    fitCard();
  }
  const CODE = get("c").toLowerCase().replace(/[^a-z0-9]/g, "");
  if (CODE) {
    document.body.classList.add("loading");
    const fail = () => { const n = document.createElement("div"); n.className = "note";
      n.innerHTML = "This card link isn't working.<small>Check the whole link was copied, or ask the sender to send it again.</small>"; document.body.appendChild(n); };
    fetch(DB.url + "/rest/v1/rpc/get_xmas_card", { method: "POST", headers: { apikey: DB.key, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: CODE, p_preview: get("preview") === "1" }) })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return fail();
        apply(d);
        const show = () => document.body.classList.remove("loading");
        if (!d.photo) return show();
        const img = new Image(); let done = false; const go = () => { if (!done) { done = true; show(); } };
        img.onload = img.onerror = go; img.src = d.photo; setTimeout(go, 6000);
      })
      .catch(fail);
  }
  if (document.fonts) document.fonts.addEventListener("loadingdone", fitCard);

  // snow: a light fall all the time, a flurry when the card comes out
  const cv = $("snow"), ctx = cv.getContext("2d");
  let flakes = [], dpr = 1;
  const fit = () => { dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  const flake = (burst) => ({ x: Math.random() * innerWidth, y: burst ? -10 - Math.random() * innerHeight * .8 : Math.random() * innerHeight,
    r: burst ? 1.6 + Math.random() * 3.2 : .8 + Math.random() * 2.2, vy: burst ? .7 + Math.random() * 1.3 : .25 + Math.random() * .6,
    sway: Math.random() * 6.28, sw: .3 + Math.random() * .6, o: burst ? .7 + Math.random() * .3 : .35 + Math.random() * .45, burst });
  function snowLoop(t){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const f of flakes) {
      f.y += f.vy; f.x += Math.sin(t / 1400 + f.sway) * f.sw;
      if (f.y > innerHeight + 8) { if (f.burst) { f.dead = true; continue; } f.y = -8; f.x = Math.random() * innerWidth; }
      ctx.globalAlpha = f.o; ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    }
    flakes = flakes.filter(f => !f.dead);
    requestAnimationFrame(snowLoop);
  }
  if (!reduce) { fit(); flakes = Array.from({ length: Math.round(Math.min(70, innerWidth * innerHeight / 9000)) }, () => flake(false)); requestAnimationFrame(snowLoop); }
  const flurry = () => { if (!reduce) flakes.push(...Array.from({ length: 90 }, () => flake(true))); };
  const calm = () => { flakes = flakes.filter(f => !f.burst); };

  // where the card comes to rest
  function finalBox(){
    const top = 24 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    const avail = innerHeight - 150 - top;
    const s = Math.min((innerWidth - 32) / 300, avail / 429, 1.45);
    return { s, x: (innerWidth - 300*s) / 2, y: top + Math.max(0, (avail - 429*s) / 2) };
  }
  const placeActions = b => { $("actions").style.top = (b.y + 429*b.s + 22) + "px"; };

  let full = null, state = "closed";
  const anims = [];
  const track = a => (anims.push(a), a);

  function open(){
    if (state !== "closed") return; state = "opening";
    $("scene").classList.add("still");
    $("skip").hidden = true;
    track(play($("hintTop"), [{ opacity: .85 }, { opacity: 0 }], { duration: 300 }));
    track(play($("hintTap"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }));

    // 1. lift and turn over (0–760ms)
    track(play($("flipper"), [
      { transform: "translateZ(0) rotateY(0deg)" },
      { transform: "translateZ(70px) rotateY(90deg)", offset: .5 },
      { transform: "translateZ(0) rotateY(180deg)" }
    ], { duration: 760, easing: EASE.flip }));
    track(play($("shadow"), [{ opacity: 1, transform: "scale(1)" }, { opacity: .45, transform: "scale(.8,.7) translateY(14px)", offset: .5 }, { opacity: 1, transform: "scale(1)" }], { duration: 760, easing: EASE.flip }));
    at(770, () => { anims.splice(anims.indexOf(anims.find(a => a.effect.target === $("flipper"))), 1)[0]?.cancel(); $("flipper").classList.add("flat"); });

    // 2. press and break the gold seal (720–1260ms)
    const seal = $("seal");
    track(play(seal, [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(.93)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 200, delay: 720, easing: EASE.inOut }));
    track(play(seal.children[0], [{ transform: "none", opacity: 1 }, { transform: "translate(-30%,12%) rotate(-26deg)", opacity: 0 }], { duration: 520, delay: 900, easing: EASE.out }));
    track(play(seal.children[1], [{ transform: "none", opacity: 1 }, { transform: "translate(30%,16%) rotate(24deg)", opacity: 0 }], { duration: 520, delay: 900, easing: EASE.out }));

    // 3. lift the tartan-lined flap (1000–1700ms)
    const FLAP_T = 700, FLAP_D = 1000;
    track(play($("flap"), [{ transform: "perspective(900px) rotateX(0deg)" }, { transform: "perspective(900px) rotateX(180deg)" }], { duration: FLAP_T, delay: FLAP_D, easing: EASE.inOut }));
    at(FLAP_D + FLAP_T / 2, () => $("flap").classList.add("under"));

    // 4. the card rises out, the envelope eases down, then the card glides up to fill the screen
    const RISE_D = 1450, RISE_T = 800;
    track(play(cardIn, [{ transform: "translateY(0)" }, { transform: "translateY(-58%)" }], { duration: RISE_T, delay: RISE_D, easing: EASE.lift }));
    const dip = Math.max(0, cardIn.getBoundingClientRect().height * .6 - $("env").getBoundingClientRect().top + 24);
    track(play($("env"), [{ transform: "translateY(0)" }, { transform: `translateY(${Math.round(dip)}px)` }], { duration: RISE_T, delay: RISE_D - 150, easing: EASE.inOut }));
    at(RISE_D + RISE_T - 100, () => takeOut(true));
  }

  function takeOut(animated){
    const r = card.getBoundingClientRect(), b = finalBox();
    full = document.createElement("div"); full.className = "full";
    full.style.transform = `translate(${r.left}px,${r.top}px) scale(${r.width / 300})`;
    card.style.transform = "none";
    full.appendChild(card); document.body.appendChild(full);
    const end = `translate(${b.x}px,${b.y}px) scale(${b.s})`;
    if (animated && !reduce) {
      const m = full.animate([{ transform: full.style.transform }, { transform: end }], { duration: 1050, easing: "cubic-bezier(.3,.2,.15,1)", fill: "forwards" });
      m.onfinish = () => { full.style.transform = end; m.cancel(); full.classList.add("settled"); };
      track(play($("scene"), [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(70px) scale(.94)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.4,0,.6,1)" }));
    } else {
      full.style.transform = end; full.classList.add("settled");
      $("scene").style.opacity = 0;
    }
    fitCard(); placeActions(b);
    $("actions").classList.add("on");
    [...$("actions").children].filter(el => !el.hidden).forEach((el, i) => track(play(el, [{ opacity: 0, transform: "translateY(10px)" }, { opacity: el.classList.contains("again") ? .75 : 1, transform: "none" }], { duration: 600, delay: animated ? 650 + i * 90 : 0, fill: "both" })));
    at(animated ? 350 : 0, flurry);
    state = "open";
  }

  function skip(){
    if (state !== "closed") return; state = "skipping";
    $("scene").classList.add("still"); $("skip").hidden = true;
    $("flipper").classList.add("flat"); $("flap").classList.add("under");
    $("hintTop").style.opacity = 0; $("hintTap").style.opacity = 0;
    takeOut(false);
  }

  function reset(){
    calm();
    anims.splice(0).forEach(a => a.cancel());
    if (full) { card.style.transform = ""; cardIn.appendChild(card); full.remove(); full = null; }
    sizeInner();
    $("flipper").classList.remove("flat"); $("flap").classList.remove("under");
    $("scene").classList.remove("still"); $("scene").style.opacity = "";
    $("hintTop").style.opacity = ""; $("hintTap").style.opacity = "";
    $("actions").classList.remove("on"); $("skip").hidden = false;
    state = "closed";
  }

  $("env").addEventListener("click", open);
  $("skip").addEventListener("click", skip);
  $("again").addEventListener("click", reset);
  addEventListener("resize", () => { if (!reduce) fit(); sizeInner(); if (full && state === "open") { const b = finalBox(); full.getAnimations().forEach(a => a.cancel()); full.style.transform = `translate(${b.x}px,${b.y}px) scale(${b.s})`; placeActions(b); } });
})();
</script>
