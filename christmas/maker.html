<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132A20">
<meta name="robots" content="noindex">
<title>Christmas Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
/* Layout: one column of cream panels on pine green — the card setup, then the list of people it goes to. */
:root{
  --bg:#132A20; --bg-2:#1B3A2D; --panel:#FBF6EC; --line:#E4D9C3; --ink:#2A1D17; --ink-soft:#6B5A4E;
  --berry:#B8202F; --berry-dk:#951927; --holly:#2F5A3A; --gold:#D4A645; --wa:#1F8F4E; --cream:#F5ECDC;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --sans:'Jost','Gill Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,var(--bg-2),var(--bg) 70%) fixed var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;color:var(--cream);padding:4px 2px}
h1{margin:0;font-family:var(--script);font-weight:400;font-size:40px;line-height:1;color:var(--cream)}
header small{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:6px}
.linkbtn{background:none;border:0;color:var(--cream);opacity:.75;font:inherit;font-size:13px;letter-spacing:.08em;text-decoration:underline;cursor:pointer;padding:6px 0}
.panel{background:var(--panel);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 30px -18px rgba(0,0,0,.6)}
.panel h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--holly)}
.panel p.help{margin:-6px 0 0;font-size:14px;color:var(--ink-soft)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--ink-soft)}
input[type=text],input[type=email],input[type=password],input[type=tel],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:0;font:inherit;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--berry);color:#fff}
.btn.primary:active{background:var(--berry-dk)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:1 1 auto}
.status{font-size:14px;color:var(--holly);min-height:1.2em}
.status.err{color:var(--berry)}

/* photo crop */
.photo-box{position:relative;width:100%;aspect-ratio:268/236;border-radius:6px;overflow:hidden;background:#34405F;display:flex;align-items:center;justify-content:center;color:var(--cream);font-size:14px;text-align:center}
.photo-box canvas{width:100%;height:100%;display:block}
.photo-box span{padding:0 20px;opacity:.85}
input[type=range]{width:100%;accent-color:var(--berry)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* people */
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.person{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:4px}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.p-name{font-size:17px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.pill{flex:none;font-size:12px;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.new{background:#EFE7D8;color:var(--ink-soft)}
.pill.sent{background:#FBEBC8;color:#7A5410}
.pill.opened{background:#DCEFD9;color:#1F5A2A}
.p-actions{display:flex;flex-wrap:wrap;gap:8px}
.p-actions .btn{min-height:40px;padding:0 14px;font-size:12px;flex:1 1 auto}
.btn.wa{background:var(--wa);color:#fff}
.btn.del{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);flex:0 0 auto}
.btn.del.armed{background:var(--berry);color:#fff;border-color:var(--berry)}
.empty{font-size:14px;color:var(--ink-soft);margin:0}
.summary{font-size:14px;color:var(--ink-soft)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Christmas cards</h1><small>Card maker</small></div>
    <button class="linkbtn" id="signOut" type="button" hidden>Sign out</button>
  </header>

  <!-- sign in -->
  <section class="panel" id="login" hidden>
    <h2>Sign in</h2>
    <p class="help">Use the same email and password as your wedding admin page.</p>
    <form id="loginForm" class="row" style="flex-direction:column;align-items:stretch">
      <label>Email<input type="email" id="email" autocomplete="username" required></label>
      <label>Password<input type="password" id="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <div class="status" id="loginStatus"></div>
  </section>

  <!-- the card -->
  <section class="panel" id="cardPanel" hidden>
    <h2>Your card</h2>
    <label id="pickWrap" hidden>Card
      <select id="pickCard"></select>
    </label>

    <div class="photo-box" id="photoBox"><span>Add your family photo. It fills the top of the card.</span></div>
    <div class="row">
      <span class="btn ghost file">Choose photo<input type="file" id="photoFile" accept="image/*"></span>
    </div>
    <label id="posWrap" hidden><span id="posLabel">Move photo</span><input type="range" id="pos" min="0" max="100" value="35"></label>

    <label>Greeting
      <input type="text" id="greeting" maxlength="60" value="Merry Christmas">
    </label>
    <div class="chips" aria-label="Greeting ideas">
      <button class="chip" type="button" data-greet="Merry Christmas">Merry Christmas</button>
      <button class="chip" type="button" data-greet="Nadolig Llawen">Nadolig Llawen</button>
      <button class="chip" type="button" data-greet="Season's Greetings">Season's Greetings</button>
      <button class="chip" type="button" data-greet="Happy Christmas">Happy Christmas</button>
    </div>
    <label>Message
      <textarea id="msg" maxlength="140">Wishing you a magical Christmas and a happy, healthy new year</textarea>
    </label>
    <label>Signed
      <input type="text" id="family" maxlength="50" placeholder="e.g. James, Kelly &amp; family">
    </label>
    <label>Your mobile, for replies (optional)
      <input type="tel" id="reply" placeholder="07700 900123" autocomplete="tel">
    </label>
    <div class="row">
      <button class="btn primary" id="saveCard" type="button">Save card</button>
      <a class="btn ghost" id="previewCard" href="#" target="_blank" rel="noopener">Preview</a>
    </div>
    <div class="status" id="cardStatus"></div>
    <button class="linkbtn" id="newCard" type="button" style="color:var(--ink-soft);align-self:flex-start">Start another card</button>
  </section>

  <!-- people -->
  <section class="panel" id="peoplePanel" hidden>
    <h2>Who's it for?</h2>
    <p class="help">Add each person or household. Each gets their own link with their name on the envelope.</p>
    <form class="row" id="addForm">
      <input type="text" id="toName" maxlength="60" placeholder="e.g. Nan &amp; Grandad" aria-label="Name for the envelope" required>
      <button class="btn primary" type="submit" style="flex:0 0 auto">Add</button>
    </form>
    <div class="summary" id="summary"></div>
    <ul class="people" id="people"></ul>
  </section>
</div>

<script>
(() => {
  const DB_URL = "https://egducrlyqakscixtnltv.supabase.co";
  const DB_KEY = "sb_publishable_JiweLKy9DWgTKpfESb1ieQ_iFBN8hP5";
  const CARD_URL = new URL("./", location.href).href;           // …/christmas/
  const $ = id => document.getElementById(id);
  const say = (el, msg, err) => { $(el).textContent = msg || ""; $(el).classList.toggle("err", !!err); };
  if (!window.supabase) { document.body.innerHTML = '<p style="color:#F5ECDC;text-align:center;padding:40px 20px">Couldn\'t load. Check your internet connection and refresh.</p>'; return; }
  const sb = window.supabase.createClient(DB_URL, DB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

  let cards = [], card = null, people = [], crop = null;

  // ---------- sign in ----------
  async function start(){
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { $("login").hidden = false; return; }
    const { data: isAdmin } = await sb.rpc("is_studio_admin");
    if (!isAdmin) { $("login").hidden = false; say("loginStatus", "That account isn't an admin on this site.", true); return; }
    $("login").hidden = true; $("signOut").hidden = false; $("cardPanel").hidden = false;
    await loadCards();
  }
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault(); say("loginStatus", "Signing in…");
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) return say("loginStatus", "Email or password not recognised. Try again.", true);
    say("loginStatus", ""); start();
  });
  $("signOut").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

  // ---------- cards ----------
  async function loadCards(selectId){
    const { data, error } = await sb.from("xmas_cards").select("*").order("created_at", { ascending: false });
    if (error) return say("cardStatus", "Couldn't load your cards: " + error.message, true);
    cards = data || [];
    $("pickWrap").hidden = cards.length < 2;
    $("pickCard").innerHTML = cards.map(c => `<option value="${c.id}">${esc(c.family || "Untitled")} · ${new Date(c.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</option>`).join("");
    showCard(cards.find(c => c.id === selectId) || cards[0] || null);
  }
  function showCard(c){
    card = c; crop = null;
    $("greeting").value = c ? c.greeting : "Merry Christmas";
    $("msg").value = c ? c.msg : "Wishing you a magical Christmas and a happy, healthy new year";
    $("family").value = c ? c.family : "";
    $("reply").value = c && c.reply ? "0" + c.reply.replace(/^44/, "") : "";
    if (c) $("pickCard").value = c.id;
    $("posWrap").hidden = true;
    const box = $("photoBox");
    box.innerHTML = c && c.photo_url ? `<canvas width="804" height="708"></canvas>` : `<span>Add your family photo. It fills the top of the card.</span>`;
    if (c && c.photo_url) { const img = new Image(); img.crossOrigin = "anonymous"; img.onload = () => box.querySelector("canvas").getContext("2d").drawImage(img, 0, 0, 804, 708); img.src = c.photo_url; }
    $("peoplePanel").hidden = !c;
    updatePreview();
    if (c) loadPeople();
  }
  $("pickCard").addEventListener("change", e => showCard(cards.find(c => c.id === e.target.value)));
  $("newCard").addEventListener("click", () => { showCard(null); $("pickWrap").hidden = true; say("cardStatus", "New card: add a photo and wording, then Save card."); scrollTo({ top: 0, behavior: "smooth" }); });
  document.querySelectorAll("[data-greet]").forEach(b => b.addEventListener("click", () => { $("greeting").value = b.dataset.greet; updatePreview(); }));
  ["greeting", "msg", "family"].forEach(id => $(id).addEventListener("input", updatePreview));

  function phone(v){ let d = (v || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "44" + d.slice(1); return d; }
  function updatePreview(){
    const q = new URLSearchParams({ to: "Your name here", family: $("family").value || "Your family", greeting: $("greeting").value || "Merry Christmas", msg: $("msg").value });
    if (card && card.photo_url && !crop) q.set("photo", card.photo_url);
    $("previewCard").href = CARD_URL + "?" + q.toString();
  }

  // ---------- photo: crop to the card's window ----------
  const W = 804, H = 708, R = W / H;
  $("photoFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      crop = { img, wide: img.width / img.height > R };
      $("posLabel").textContent = crop.wide ? "Move photo left or right" : "Move photo up or down";
      $("pos").value = crop.wide ? 50 : 30;
      $("posWrap").hidden = crop.wide ? Math.abs(img.width / img.height - R) < .02 : Math.abs(img.width / img.height - R) < .02;
      $("photoBox").innerHTML = `<canvas width="${W}" height="${H}"></canvas>`;
      drawCrop(); updatePreview();
      say("cardStatus", "Photo ready. Tap Save card to use it.");
    };
    img.onerror = () => say("cardStatus", "That file couldn't be opened as a photo. Try a JPEG or PNG.", true);
    img.src = URL.createObjectURL(f);
  });
  $("pos").addEventListener("input", drawCrop);
  function drawCrop(){
    if (!crop) return;
    const { img, wide } = crop, t = $("pos").value / 100;
    let sw, sh, sx, sy;
    if (wide) { sh = img.height; sw = sh * R; sx = (img.width - sw) * t; sy = 0; }
    else { sw = img.width; sh = sw / R; sx = 0; sy = (img.height - sh) * t; }
    const ctx = $("photoBox").querySelector("canvas").getContext("2d");
    ctx.imageSmoothingQuality = "high"; ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  }

  // ---------- save ----------
  $("saveCard").addEventListener("click", async () => {
    const family = $("family").value.trim();
    if (!family) { say("cardStatus", "Add who it's signed from, e.g. James, Kelly & family.", true); $("family").focus(); return; }
    if (!crop && !(card && card.photo_url)) { say("cardStatus", "Choose a photo first.", true); return; }
    $("saveCard").disabled = true; say("cardStatus", "Saving…");
    try {
      const row = { family, greeting: $("greeting").value.trim() || "Merry Christmas", msg: $("msg").value.trim(), reply: phone($("reply").value) };
      if (!card) { const { data, error } = await sb.from("xmas_cards").insert(row).select().single(); if (error) throw error; card = data; }
      if (crop) {
        say("cardStatus", "Uploading photo…");
        const blob = await new Promise(r => $("photoBox").querySelector("canvas").toBlob(r, "image/jpeg", .86));
        const path = `${card.id}/${Date.now()}.jpg`;
        const { error: upErr } = await sb.storage.from("xmas-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (upErr) throw upErr;
        row.photo_url = sb.storage.from("xmas-photos").getPublicUrl(path).data.publicUrl;
      }
      const { data, error } = await sb.from("xmas_cards").update(row).eq("id", card.id).select().single();
      if (error) throw error;
      card = data; crop = null; $("posWrap").hidden = true; $("photoFile").value = "";
      say("cardStatus", "Saved. Now add who it's for.");
      await loadCards(card.id);
    } catch (err) { say("cardStatus", "Couldn't save: " + (err.message || err), true); }
    $("saveCard").disabled = false;
  });

  // ---------- people ----------
  async function loadPeople(){
    if (!card) return;
    const { data, error } = await sb.from("xmas_recipients").select("*").eq("card_id", card.id).order("created_at");
    if (error) return say("cardStatus", "Couldn't load the list: " + error.message, true);
    people = data || []; renderPeople();
  }
  const link = p => CARD_URL + "?c=" + p.code;
  const waText = p => `🎄 ${p.to_name}, here's a Christmas card from ${card.family}. Tap to open it:\n${link(p)}`;
  function renderPeople(){
    const opened = people.filter(p => p.opened_at).length, sent = people.filter(p => p.sent_at || p.opened_at).length;
    $("summary").textContent = people.length ? `${people.length} card${people.length > 1 ? "s" : ""} · ${sent} sent · ${opened} opened` : "";
    $("people").innerHTML = people.length ? people.map(p => {
      const st = p.opened_at ? `<span class="pill opened">Opened${p.opens > 1 ? " ×" + p.opens : ""}</span>` : p.sent_at ? `<span class="pill sent">Sent</span>` : `<span class="pill new">Not sent</span>`;
      return `<li class="person" data-code="${p.code}">
        <div class="p-top"><span class="p-name">${esc(p.to_name)}</span>${st}</div>
        <div class="p-actions">
          <a class="btn wa" data-act="wa" href="https://wa.me/?text=${encodeURIComponent(waText(p))}" target="_blank" rel="noopener">WhatsApp</a>
          <button class="btn ghost" data-act="copy" type="button">Copy link</button>
          <a class="btn ghost" href="${link(p)}&preview=1" target="_blank" rel="noopener">Preview</a>
          <button class="btn del" data-act="del" type="button" aria-label="Remove ${esc(p.to_name)}">Remove</button>
        </div></li>`;
    }).join("") : `<li class="empty">No one added yet.</li>`;
  }
  $("addForm").addEventListener("submit", async e => {
    e.preventDefault(); const to_name = $("toName").value.trim(); if (!to_name || !card) return;
    const { data, error } = await sb.from("xmas_recipients").insert({ card_id: card.id, to_name }).select().single();
    if (error) return say("cardStatus", "Couldn't add them: " + error.message, true);
    people.push(data); $("toName").value = ""; renderPeople();
  });
  $("people").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const li = b.closest(".person"), p = people.find(x => x.code === li.dataset.code);
    if (b.dataset.act === "wa") {
      if (!p.sent_at) { p.sent_at = new Date().toISOString(); sb.from("xmas_recipients").update({ sent_at: p.sent_at }).eq("code", p.code).then(() => {}); setTimeout(renderPeople, 400); }
    } else if (b.dataset.act === "copy") {
      try { await navigator.clipboard.writeText(link(p)); b.textContent = "Copied"; } catch { prompt("Copy this link", link(p)); }
      setTimeout(() => b.textContent = "Copy link", 1600);
    } else if (b.dataset.act === "del") {
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap to remove"; setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remove"; }, 3000); return; }
      const { error } = await sb.from("xmas_recipients").delete().eq("code", p.code);
      if (error) return say("cardStatus", "Couldn't remove them: " + error.message, true);
      people = people.filter(x => x !== p); renderPeople();
    }
  });
  // refresh opened ticks when you come back to the page
  document.addEventListener("visibilitychange", () => { if (!document.hidden && card) loadPeople(); });

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  start();
})();
</script>
</body>
</html>
