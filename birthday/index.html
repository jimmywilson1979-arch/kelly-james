<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151C35">
<meta property="og:type" content="website">
<meta property="og:title" content="A birthday card for you">
<meta property="og:description" content="Tap to open it, make a wish and blow out the candles.">
<meta property="og:image" content="https://jimmywilson1979-arch.github.io/kelly-james/birthday/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>A birthday card for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One teal envelope on a party table under drifting confetti. Tap → it turns over → the gold seal breaks →
   the flap lifts → the card rises out and fills the screen. Then: make a wish and blow into the phone
   (microphone) — or tap the flames — and the candles go out one by one, with smoke, confetti and a little tune. */
:root{
  --table:#151C35; --table-lit:#26345E;
  --env:#1E6E78; --env-2:#1A616A; --env-3:#155259; --env-edge:#0E3A40;
  --paper:#FBF6EC; --ink:#2A1D17; --ink-soft:#5B4A3F; --cream:#F5ECDC;
  --coral:#E8604F; --coral-deep:#C8473A; --teal-deep:#1A5560; --gold:#D4A645; --gold-hi:#F1D58A; --gold-lo:#9C7424;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Gill Sans','Trebuchet MS',sans-serif;
  --w:min(76vw,330px,calc((100svh - 230px) / 1.4));
  --liner:
    radial-gradient(circle at 20% 30%,#E8604F 0 2.6px,transparent 3.1px) 0 0/34px 34px,
    radial-gradient(circle at 70% 62%,#D4A645 0 2.6px,transparent 3.1px) 0 0/34px 34px,
    radial-gradient(circle at 44% 86%,#1E6E78 0 2.2px,transparent 2.7px) 0 0/34px 34px,
    radial-gradient(circle at 86% 14%,#C94F7C 0 2px,transparent 2.5px) 0 0/34px 34px,
    #FBF3E4;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(circle at 12% 30%,rgba(255,196,110,.16) 0 3px,rgba(255,196,110,0) 28px),
  radial-gradient(circle at 86% 36%,rgba(232,96,79,.16) 0 3px,rgba(232,96,79,0) 30px),
  radial-gradient(circle at 20% 70%,rgba(127,183,190,.14) 0 3px,rgba(127,183,190,0) 26px),
  radial-gradient(circle at 80% 66%,rgba(255,196,110,.14) 0 3px,rgba(255,196,110,0) 28px),
  radial-gradient(120% 80% at 50% 38%,var(--table-lit),var(--table) 70%);
  background-color:var(--table);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;z-index:2;padding-top:30px;box-sizing:border-box}
.hint{font-family:var(--serif);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.85;text-align:center}
.tap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.tap i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,166,69,.6)}70%,100%{box-shadow:0 0 0 12px rgba(212,166,69,0)}}

/* ---------- envelope ---------- */
.scene{position:relative;perspective:1400px;animation:float 5s ease-in-out infinite}
.scene.still{animation:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.env{display:block;position:relative;width:var(--w);height:calc(var(--w) * 1.4);cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;transform-style:preserve-3d}
.env:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:6px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d}
.flipper.flat{transform-style:flat}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shadow{position:absolute;left:8%;right:8%;bottom:-3%;height:10%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(14px)}
.front{background:radial-gradient(130% 90% at 30% 20%,#27808B,var(--env) 55%,var(--env-2));display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px var(--env-edge)}
.front::before{content:"";position:absolute;inset:0;border-radius:6px;opacity:.1;
  background:radial-gradient(circle,#fff 0 1.2px,transparent 1.6px) 0 0/22px 22px,radial-gradient(circle,#fff 0 .8px,transparent 1.2px) 11px 11px/22px 22px}
.front::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%,rgba(0,0,0,.08));pointer-events:none}
.to{font-size:calc(var(--w) * .033);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);opacity:.85;position:relative}
.names{position:relative;font-family:var(--script);font-size:calc(var(--w) * .15);line-height:1.15;color:var(--cream);text-align:center;padding:0 9%;margin:6px 0 10px;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rule{position:relative;width:38%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.from{position:absolute;left:8%;bottom:6%;font-family:var(--script);font-size:calc(var(--w) * .058);color:var(--gold-hi);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sprig{position:absolute;right:4%;bottom:3%;width:calc(var(--w) * .24);height:auto}
.stamp{position:absolute;top:6%;right:7%;width:calc(var(--w) * .17);aspect-ratio:5/6;padding:5px;background:#fff;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.25);transform:rotate(3deg)}
.stamp::before{content:"";position:absolute;inset:-3px;background:radial-gradient(circle,var(--env) 2.1px,transparent 2.4px) 0 0/6px 6px}
.stamp svg{position:relative;display:block;width:100%;height:100%}
.postmark{position:absolute;top:9%;right:calc(7% + var(--w) * .1);width:calc(var(--w) * .3);height:auto;opacity:.5}

.back{transform:rotateY(180deg);background:var(--env-3)}
.flipper.flat .back{transform:none}
.flipper.flat .front{visibility:hidden}
.inside{position:absolute;inset:0;border-radius:6px;background:var(--liner)}
.inside::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 34%)}
.card-in{position:absolute;z-index:2;left:5%;top:5%;width:90%;aspect-ratio:116/166}
.pocket{position:absolute;z-index:3;inset:0;width:100%;height:100%;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.18))}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;transform-origin:50% 0;transform-style:preserve-3d;z-index:5}
.flap .o,.flap .l{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .o{background:linear-gradient(180deg,#227984,var(--env-2))}
.flap .l{background:var(--liner);transform:rotateX(180deg);clip-path:polygon(50% 0,100% 100%,0 100%)}
.flap.under{z-index:1}
.seal{position:absolute;left:50%;top:55%;width:calc(var(--w) * .22);aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.seal span{position:absolute;inset:0;border-radius:47% 53% 50% 50% / 52% 48% 52% 48%;background:radial-gradient(circle at 36% 30%,var(--gold-hi),var(--gold) 52%,var(--gold-lo));
  box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:rgba(110,72,14,.6)}
.seal svg{width:56%;height:56%;filter:drop-shadow(0 1px 0 rgba(255,240,200,.45)) drop-shadow(0 -1px 0 rgba(80,50,8,.35))}
.seal .a{clip-path:polygon(0 0,54% 0,46% 38%,57% 61%,45% 100%,0 100%)}
.seal .b{clip-path:polygon(54% 0,100% 0,100% 100%,45% 100%,57% 61%,46% 38%)}

/* ---------- the card ---------- */
.cardface{position:absolute;left:0;top:0;width:300px;height:429px;transform-origin:0 0;background:var(--paper);
  border-radius:3px;box-shadow:0 10px 24px -14px rgba(0,0,0,.5);color:var(--ink);text-align:center;overflow:hidden}
.cardface::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);border-radius:2px;pointer-events:none;opacity:.8}
.pic{position:absolute;left:16px;top:16px;width:268px;height:236px;border-radius:2px;overflow:hidden;background:linear-gradient(#223862,#1A2A4C 70%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cake{display:block;width:100%;height:100%}
.cake .fl{transform-origin:0 0;animation:flicker 1.9s ease-in-out infinite}
.cake .lean{transform-origin:0 0;transition:transform .12s}
.cake .fl,.cake .glow{transition:opacity .35s,transform .35s}
.cake .glow{transform-origin:0 -8px;animation:glow 2.6s ease-in-out infinite}
.cake .warm{transition:opacity 1.2s}
.cake .smoke{opacity:0;stroke-dasharray:60;stroke-dashoffset:60}
.cake .candle.out .fl{animation:none;opacity:0;transform:scale(.2,0)}
.cake .candle.out .glow{animation:none;opacity:0}
.cake .candle.out .smoke{animation:smoke 2.4s ease-out forwards}
.cake.dark .warm{opacity:.15}
.cake *{pointer-events:none}
.candle-hit{fill:transparent}
.full .pic{cursor:pointer}
@keyframes flicker{20%{transform:scale(.93,1.07) rotate(-3deg)}45%{transform:scale(1.05,.95) rotate(1deg)}70%{transform:scale(.96,1.05) rotate(3deg)}}
@keyframes glow{50%{transform:scale(1.15);opacity:.8}}
@keyframes smoke{0%{opacity:.85;stroke-dashoffset:60;transform:translateY(0)}60%{opacity:.5;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0;transform:translateY(-10px)}}
.cf{position:absolute;left:0;right:0;font-family:var(--sans);font-size:8.4px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);line-height:1.85;padding:0 26px}
.cf.script{font-family:var(--script);text-transform:none;letter-spacing:0}
.cf .fit{display:inline-block;white-space:nowrap}
.cf.greet{top:256px;height:52px;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1.1;color:var(--coral-deep);padding:0 14px;white-space:nowrap;box-sizing:border-box}
.cf.msg{top:310px;text-wrap:balance}
.cf.star{top:345px;height:12px;width:60px;margin:0 auto;padding:0}
.cf.lovefrom{top:362px;font-size:7.6px}
.cf.family{top:374px;font-size:25px;line-height:1.2;color:var(--teal-deep);white-space:nowrap;padding:0 18px}
.cf-corner{position:absolute;width:30px;height:30px;bottom:10px;pointer-events:none}
.cf-corner.l{left:10px}
.cf-corner.r{right:10px;transform:scaleX(-1)}
.full{position:fixed;left:0;top:0;z-index:20;transform-origin:0 0;will-change:transform}
.full .cardface{position:relative;transform:none;transition:box-shadow .9s}
.full.settled .cardface{box-shadow:0 30px 60px -24px rgba(0,0,0,.65)}

/* ---------- under the card: make a wish ---------- */
.actions{position:fixed;left:0;right:0;z-index:21;display:flex;flex-direction:column;align-items:center;gap:8px;visibility:hidden;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actions > *{opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.actions.on{visibility:visible}
.actions.on > *{opacity:1;transform:none}
.actions.on > :nth-child(2){transition-delay:.12s}.actions.on > :nth-child(3){transition-delay:.24s}.actions.on > :nth-child(4){transition-delay:.36s}
.wish{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--cream)}
.small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(245,236,220,.4);cursor:pointer}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 10px 24px -10px rgba(232,96,79,.8)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn svg{width:16px;height:16px}
.btn.listening{animation:pulse2 1.2s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(232,96,79,.7)}70%,100%{box-shadow:0 0 0 16px rgba(232,96,79,0)}}
.row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.again{background:none;border:0;color:var(--cream);opacity:.75;font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:12px;cursor:pointer}
.skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:30;background:rgba(0,0,0,.25);border:1px solid rgba(245,236,220,.35);color:var(--cream);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}

/* ---------- the party table: hand-drawn decorations ---------- */
.decor{position:fixed;z-index:1;pointer-events:none;width:min(30vw,250px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.decor.top{left:0;top:0;width:100%;height:84px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.decor.bl{left:0;bottom:0}
.decor.br{right:0;bottom:0}
@media (max-width:520px){.decor{width:32vw}.decor.top{width:100%;height:64px}}
@media (max-height:560px){.decor{width:min(22vw,190px)}}
@media (prefers-reduced-motion:reduce){.tap i,.scene,.cake .fl,.cake .glow{animation:none}}
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE = { flip: "cubic-bezier(.65,0,.35,1)", out: "cubic-bezier(.22,1,.36,1)", inOut: "cubic-bezier(.45,0,.55,1)", lift: "cubic-bezier(.33,0,.25,1)" };

  const at = (ms, fn) => setTimeout(fn, reduce ? 0 : ms);

  // personalise:  ?to=Tom  &from=James%20%26%20Kelly  &msg=…  &greeting=…  &reply=447700900123 (WhatsApp number for the thank-you)
  const P = new URLSearchParams(location.search);
  const get = k => (P.get(k) || "").trim().slice(0, 140);
  const to = get("to"), from = get("from");
  const card0 = $("cardTpl").content.firstElementChild;
  const field = k => card0.querySelector(`[data-f="${k}"]`);
  if (to) { $("names").textContent = to; document.title = "A birthday card for " + to; }

  field("greeting").textContent = get("greeting") || ("Happy Birthday" + (to ? " " + to : ""));
  if (get("msg")) field("msg").textContent = get("msg");
  card0.setAttribute("aria-label", `Birthday card: ${field("greeting").textContent}, with love from ${field("family").textContent}. A cake with five lit candles.`);
  $("pmYear").textContent = new Date().getFullYear();
  const thanks = `Thank you for the birthday card${from ? ", " + from : ""}! Candles out and wish made 🎂`;
  $("replyBtn").href = "https://wa.me/" + get("reply").replace(/\D/g, "") + "?text=" + encodeURIComponent(thanks);

  // the card lives inside the envelope until it's pulled out
  const cardIn = $("cardIn");
  const card = card0.cloneNode(true);
  cardIn.appendChild(card);
  const sizeInner = () => { if (card.parentNode === cardIn) card.style.transform = `scale(${(cardIn.getBoundingClientRect().width || 300) / 300})`; };
  sizeInner();
  const fitLine = (el, min) => {
    let t = el.querySelector("span.fit"); if (!t) { t = document.createElement("span"); t.className = "fit"; t.textContent = el.textContent; el.textContent = ""; el.appendChild(t); }
    el.style.fontSize = ""; let fs = parseFloat(getComputedStyle(el).fontSize);
    const cs = getComputedStyle(el), avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    while (t.offsetWidth * 1.08 > avail && fs > min) { fs -= 1; el.style.fontSize = fs + "px"; } };
  const fitCard = () => { fitLine(card.querySelector('[data-f="greeting"]'), 15); fitLine(card.querySelector('[data-f="family"]'), 15); };
  fitCard(); (document.fonts && document.fonts.ready || Promise.resolve()).then(fitCard);
  if (document.fonts) document.fonts.addEventListener("loadingdone", fitCard);

  // ---------- sound (unlocked by the tap that opens the envelope) ----------
  let ac = null;
  const audio = () => {
    if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) try { ac = new A(); } catch (e) {} }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  };
  function puff(){
    const a = ac; if (!a || a.state !== "running") return;
    const n = a.sampleRate * .35, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    fl.type = "bandpass"; fl.frequency.value = 900; fl.Q.value = .6; g.gain.value = .22;
    s.buffer = b; s.connect(fl); fl.connect(g); g.connect(a.destination); s.start();
  }
  // "Happy Birthday" on a little music box
  const MEL = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
               [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3]];
  function tune(){
    const a = ac; if (!a || a.state !== "running") return;
    const beat = .36, master = a.createGain(); master.gain.value = .16; master.connect(a.destination);
    let t = a.currentTime + .1;
    for (const [m, len] of MEL) {
      const fq = 440 * Math.pow(2, (m - 69) / 12);
      for (const [mult, vol, type] of [[1, 1, "sine"], [2, .28, "sine"], [3, .08, "triangle"]]) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = fq * mult;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.001, t + Math.max(.5, len * beat * 1.6));
        o.connect(g); g.connect(master); o.start(t); o.stop(t + len * beat * 1.7 + .1);
      }
      t += len * beat;
    }
  }

  // ---------- confetti: a gentle drift all the time, bursts for the big moments ----------
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const COLS = ["#E8604F", "#D4A645", "#F1D58A", "#1E6E78", "#7FB7BE", "#F5ECDC", "#C94F7C"];
  let bits = [], dpr = 1;
  const fit = () => { dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  const bit = (x, y, vx, vy, burst) => ({ x, y, vx, vy, burst, w: 4 + Math.random() * 4, h: 7 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - .5) * .22,
    flip: Math.random() * 6.28, vf: .06 + Math.random() * .12, c: COLS[Math.floor(Math.random() * COLS.length)], sway: Math.random() * 6.28, o: burst ? 1 : .5 });
  const drift = () => bit(Math.random() * innerWidth, -12 - Math.random() * innerHeight, 0, .35 + Math.random() * .5, false);
  function loop(t){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const b of bits) {
      if (b.burst) { b.vy = Math.min(b.vy + .17, 3.2); b.vx *= .985; }
      else b.vx = Math.sin(t / 1300 + b.sway) * .45;
      b.x += b.vx; b.y += b.vy; b.r += b.vr; b.flip += b.vf;
      if (b.y > innerHeight + 16) { if (b.burst) { b.dead = true; continue; } Object.assign(b, drift(), { y: -12 }); }
      ctx.save(); ctx.globalAlpha = b.o; ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.scale(1, Math.cos(b.flip));
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
    }
    bits = bits.filter(b => !b.dead);
    requestAnimationFrame(loop);
  }
  if (!reduce) {
    fit(); bits = Array.from({ length: Math.round(Math.min(34, innerWidth * innerHeight / 14000)) }, () => { const b = drift(); b.y = Math.random() * innerHeight; return b; });
    requestAnimationFrame(loop);
  }
  const shower = n => { if (!reduce) for (let i = 0; i < n; i++) bits.push(bit(Math.random() * innerWidth, -10 - Math.random() * innerHeight * .5, (Math.random() - .5) * 1.5, 1 + Math.random() * 1.5, true)); };
  const popper = () => { if (reduce) return;
    for (const side of [0, 1]) for (let i = 0; i < 80; i++) {
      const vy = -Math.sqrt(2 * .17 * innerHeight * (.55 + Math.random() * .45));
      bits.push(bit(side ? innerWidth + 4 : -4, innerHeight + 4, (side ? -1 : 1) * (1.5 + Math.random() * 5.5), vy, true));
    } };
  const calm = () => { bits = bits.filter(b => !b.burst); };

  // ---------- the candles ----------
  const candles = () => [...card.querySelectorAll(".candle")];
  const lit = () => candles().filter(c => !c.classList.contains("out"));
  let celebrated = false;
  function snuff(c){
    if (!c || c.classList.contains("out")) return;
    c.classList.add("out"); puff();
    if (!lit().length && !celebrated) { celebrated = true; card.querySelector(".cake").classList.add("dark"); at(800, celebrate); }
  }
  function relight(){
    stopMic(); celebrated = false;
    candles().forEach(c => c.classList.remove("out"));
    card.querySelector(".cake").classList.remove("dark");
    ui("wish");
  }
  // a tap near the candles puts out the nearest lit flame (forgiving for fingers)
  card.addEventListener("click", e => {
    if (state !== "open" || !e.target.closest(".pic")) return;
    let best = null, bd = Infinity;
    for (const c of lit()) {
      const r = c.querySelector(".candle-hit").getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height * .3));
      if (d < bd) { bd = d; best = c; }
    }
    const unit = card.getBoundingClientRect().width / 300;
    if (best && bd < 70 * unit) { audio(); snuff(best); }
  });

  function ui(phase){
    const show = (id, on) => { $(id).hidden = !on; };
    $("blowBtn").classList.toggle("listening", phase === "listening");
    show("blowBtn", phase === "wish" || phase === "listening" || phase === "asking");
    show("blowHint", phase !== "done");
    show("replyBtn", phase === "done");
    show("doneRow", phase === "done");
    $("blowBtn").lastElementChild.textContent = { wish: "Blow out the candles", asking: "Allow the microphone…", listening: "Blow!" }[phase] || "";
    $("wish").textContent = phase === "done" ? "Wish made! Happy birthday 🎉" : "Make a wish…";
    $("blowHint").textContent = { wish: "or tap the flames", asking: "so the card can hear you blow", listening: "Blow on the bottom of your phone", nomic: "Just tap each flame to blow it out" }[phase] || "";
  }

  // blowing into the microphone: a loud, sustained rush of air puts a candle out every fifth of a second
  let stream = null, raf = 0;
  async function listen(){
    audio();
    if (stream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return ui("nomic");
    ui("asking");
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
    catch (e) { stream = null; return ui("nomic"); }
    const a = audio(); if (!a || state !== "open" || celebrated) { stopMic(); return ui(celebrated ? "done" : "nomic"); }
    const src = a.createMediaStreamSource(stream), an = a.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let floor = .012, blow = 0, last = performance.now();
    ui("listening");
    const tick = now => {
      if (!stream) return;
      const dt = Math.min(100, now - last); last = now;
      an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      const rms = Math.sqrt(s / buf.length), thr = Math.max(.06, floor * 3.5);
      floor += (rms - floor) * (rms > floor ? .004 : .05);      // follows the room's background noise
      const lvl = Math.min(1, rms / (thr * 1.6));
      lean(rms > thr * .45 ? lvl : 0);
      if (rms > thr) { blow += dt; if (blow > 190) { blow = 0; const l = lit(); snuff(l[Math.floor(Math.random() * l.length)]); } }
      else blow = Math.max(0, blow - dt * .5);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function stopMic(){ cancelAnimationFrame(raf); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } lean(0); }
  function lean(l){ card.querySelectorAll(".lean").forEach((g, i) => { g.style.transform = l ? `skewX(${-(16 + i * 4) * l}deg) scale(${1 - .12 * l},${1 - .3 * l})` : ""; }); }

  function celebrate(){ stopMic(); ui("done"); popper(); at(500, () => shower(70)); at(300, tune); }

  // ---------- opening the envelope ----------
  function finalBox(){
    const top = 18 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    const avail = innerHeight - 176 - top;
    const s = Math.min((innerWidth - 32) / 300, avail / 429, 1.45);
    return { s, x: (innerWidth - 300 * s) / 2, y: top + Math.max(0, (avail - 429 * s) / 2) };
  }
  const placeActions = b => { $("actions").style.top = (b.y + 429 * b.s + 18) + "px"; };
  let full = null, state = "closed";
  const anims = [];
  const track = a => (anims.push(a), a);

  function open(){
    if (state !== "closed") return; state = "opening";
    audio();
    $("scene").classList.add("still"); $("skip").hidden = true;
    track(play($("hintTop"), [{ opacity: .85 }, { opacity: 0 }], { duration: 300 }));
    track(play($("hintTap"), [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }));
    track(play($("flipper"), [
      { transform: "translateZ(0) rotateY(0deg)" }, { transform: "translateZ(70px) rotateY(90deg)", offset: .5 }, { transform: "translateZ(0) rotateY(180deg)" }
    ], { duration: 760, easing: EASE.flip }));
    track(play($("shadow"), [{ opacity: 1, transform: "scale(1)" }, { opacity: .45, transform: "scale(.8,.7) translateY(14px)", offset: .5 }, { opacity: 1, transform: "scale(1)" }], { duration: 760, easing: EASE.flip }));
    at(770, () => { const i = anims.findIndex(a => a.effect.target === $("flipper")); if (i >= 0) anims.splice(i, 1)[0].cancel(); $("flipper").classList.add("flat"); });
    const seal = $("seal");
    track(play(seal, [{ transform: "translate(-50%,-50%) scale(1)" }, { transform: "translate(-50%,-50%) scale(.93)" }, { transform: "translate(-50%,-50%) scale(1)" }], { duration: 200, delay: 720, easing: EASE.inOut }));
    track(play(seal.children[0], [{ transform: "none", opacity: 1 }, { transform: "translate(-30%,12%) rotate(-26deg)", opacity: 0 }], { duration: 520, delay: 900 }));
    track(play(seal.children[1], [{ transform: "none", opacity: 1 }, { transform: "translate(30%,16%) rotate(24deg)", opacity: 0 }], { duration: 520, delay: 900 }));
    const FLAP_T = 700, FLAP_D = 1000;
    track(play($("flap"), [{ transform: "perspective(900px) rotateX(0deg)" }, { transform: "perspective(900px) rotateX(180deg)" }], { duration: FLAP_T, delay: FLAP_D, easing: EASE.inOut }));
    at(FLAP_D + FLAP_T / 2, () => $("flap").classList.add("under"));
    const RISE_D = 1450, RISE_T = 800;
    track(play(cardIn, [{ transform: "translateY(0)" }, { transform: "translateY(-58%)" }], { duration: RISE_T, delay: RISE_D, easing: EASE.lift }));
    const dip = Math.max(0, cardIn.getBoundingClientRect().height * .6 - $("env").getBoundingClientRect().top + 24);
    track(play($("env"), [{ transform: "translateY(0)" }, { transform: `translateY(${Math.round(dip)}px)` }], { duration: RISE_T, delay: RISE_D - 150, easing: EASE.inOut }));
    at(RISE_D + RISE_T - 100, () => takeOut(true));
  }

  function takeOut(animated){
    const r = card.getBoundingClientRect(), b = finalBox();
    full = document.createElement("div"); full.className = "full";
    full.style.transform = `translate(${r.left}px,${r.top}px) scale(${r.width / 300})`;
    card.style.transform = "none";
    full.appendChild(card); document.body.appendChild(full);
    const end = `translate(${b.x}px,${b.y}px) scale(${b.s})`;
    if (animated && !reduce) {
      const m = full.animate([{ transform: full.style.transform }, { transform: end }], { duration: 1050, easing: "cubic-bezier(.3,.2,.15,1)", fill: "forwards" });
      m.onfinish = () => { full.style.transform = end; m.cancel(); full.classList.add("settled"); };
      track(play($("scene"), [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(70px) scale(.94)", opacity: 0 }], { duration: 700, easing: "cubic-bezier(.4,0,.6,1)" }));
    } else { full.style.transform = end; full.classList.add("settled"); $("scene").style.opacity = 0; }
    fitCard(); placeActions(b); ui("wish");
    at(animated ? 700 : 0, () => $("actions").classList.add("on"));
    at(animated ? 350 : 0, () => shower(60));
    state = "open";
  }

  function skip(){
    if (state !== "closed") return; state = "skipping"; audio();
    $("scene").classList.add("still"); $("skip").hidden = true;
    $("flipper").classList.add("flat"); $("flap").classList.add("under");
    $("hintTop").style.opacity = 0; $("hintTap").style.opacity = 0;
    takeOut(false);
  }

  function reset(){
    calm(); relight();
    anims.splice(0).forEach(a => a.cancel());
    if (full) { card.style.transform = ""; cardIn.appendChild(card); full.remove(); full = null; }
    sizeInner();
    $("flipper").classList.remove("flat"); $("flap").classList.remove("under");
    $("scene").classList.remove("still"); $("scene").style.opacity = "";
    $("hintTop").style.opacity = ""; $("hintTap").style.opacity = "";
    $("actions").classList.remove("on"); $("skip").hidden = false;
    state = "closed";
  }

  $("env").addEventListener("click", open);
  $("skip").addEventListener("click", skip);
  $("again").addEventListener("click", reset);
  $("relight").addEventListener("click", relight);
  $("blowBtn").addEventListener("click", listen);
  addEventListener("resize", () => { if (!reduce) fit(); sizeInner(); if (full && state === "open") { const b = finalBox(); full.getAnimations().forEach(a => a.cancel()); full.style.transform = `translate(${b.x}px,${b.y}px) scale(${b.s})`; placeActions(b); } });
  addEventListener("pagehide", stopMic);
})();
</script>
</body>
</html>
