<title>Kelly &amp; James Invitation</title>

<style>
/* Layout: one envelope on a sage tablecloth. Tap → it lifts and turns over in 3D → seal breaks → flap lifts →
   the card rises out and carries on, in one movement, to fill the screen. Deliberately single-look (a letterpress world). */
:root{
  --table:#3E4A3C; --table-lit:#56644F;
  --paper:#F6EFE2; --paper-2:#EFE5D2; --paper-3:#E7DAC2; --edge:#D6C6A8;
  --ink:#2E241F; --ink-soft:#5A4A40; --cream:#F3EBDD;
  --rose:#B5303E; --wax:#8E1F2E; --wax-hi:#B8394A; --gold:#D9A43A;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost','Gill Sans','Trebuchet MS',sans-serif;
  --w:min(76vw,330px,calc((100svh - 230px) / 1.4));
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 35%,var(--table-lit),var(--table) 70%);background-color:var(--table);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.hint{font-family:var(--serif);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream);opacity:.85;text-align:center}
.tap{font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.tap i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,164,58,.6)}70%,100%{box-shadow:0 0 0 12px rgba(217,164,58,0)}}

/* ---------- envelope ---------- */
.scene{position:relative;perspective:1400px;animation:float 5s ease-in-out infinite}
.scene.still{animation:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.env{display:block;position:relative;width:var(--w);height:calc(var(--w) * 1.4);cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;transform-style:preserve-3d}
.env:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:6px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d}
.flipper.flat{transform-style:flat}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.shadow{position:absolute;left:8%;right:8%;bottom:-3%;height:10%;border-radius:50%;background:rgba(0,0,0,.42);filter:blur(14px)}
.front{background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.front::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.04));pointer-events:none}
.to{font-size:calc(var(--w) * .033);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.names{font-family:var(--script);font-size:calc(var(--w) * .135);line-height:1.15;color:var(--ink);text-align:center;padding:0 9%;margin:6px 0 10px;text-wrap:balance}
.rule{width:38%;height:1px;background:var(--edge)}
.from{position:absolute;left:8%;bottom:6%;font-family:var(--script);font-size:calc(var(--w) * .06);color:var(--rose)}
.stamp{position:absolute;top:6%;right:7%;width:calc(var(--w) * .17);aspect-ratio:5/6;padding:5px;background:#fff;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.12);transform:rotate(3deg)}
.stamp::before{content:"";position:absolute;inset:-3px;background:radial-gradient(circle,var(--paper) 2.1px,transparent 2.4px) 0 0/6px 6px}
.stamp b{position:relative;display:block;width:100%;height:100%;background:var(--stamp) center/cover}
.postmark{position:absolute;top:9%;right:calc(7% + var(--w) * .1);width:calc(var(--w) * .3);height:auto;opacity:.6}

.back{transform:rotateY(180deg);background:var(--paper-3)}
.flipper.flat .back{transform:none}
.flipper.flat .front{visibility:hidden}
.inside{position:absolute;inset:0;border-radius:6px;background:var(--liner) center top/cover;opacity:.92}
.inside::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,0) 34%)}
.card-in{position:absolute;z-index:2;left:5%;top:5%;width:90%;aspect-ratio:116/166}
.pocket{position:absolute;z-index:3;inset:0;width:100%;height:100%;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.08))}
.flap{position:absolute;left:0;top:0;width:100%;height:56%;transform-origin:50% 0;transform-style:preserve-3d;z-index:5}
.flap .o,.flap .l{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .o{background:linear-gradient(180deg,var(--paper),var(--paper-2))}
.flap .l{background:var(--liner) 0 0/50% auto repeat var(--paper);transform:rotateX(180deg);clip-path:polygon(50% 0,100% 100%,0 100%)}
.flap.under{z-index:1}
.seal{position:absolute;left:50%;top:55%;width:calc(var(--w) * .22);aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.seal span{position:absolute;inset:0;border-radius:47% 53% 50% 50% / 52% 48% 52% 48%;background:radial-gradient(circle at 38% 32%,var(--wax-hi),var(--wax) 62%,#6E1522);
  box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
  font-family:var(--script);font-size:calc(var(--w) * .075);color:rgba(255,215,215,.55);text-shadow:0 -1px 0 rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.15)}
.seal .a{clip-path:polygon(0 0,54% 0,46% 38%,57% 61%,45% 100%,0 100%)}
.seal .b{clip-path:polygon(54% 0,100% 0,100% 100%,45% 100%,57% 61%,46% 38%)}

/* ---------- the invitation card ---------- */
.cardface{position:absolute;left:0;top:0;width:300px;height:429px;transform-origin:0 0;background:var(--cardbg) center/cover var(--paper);
  border-radius:3px;box-shadow:0 10px 24px -14px rgba(0,0,0,.45);color:var(--ink);text-align:center;overflow:hidden}
.cf{position:absolute;left:0;right:0;font-family:var(--sans);font-size:8.6px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);line-height:1.85}
.cf.script{font-family:var(--script);text-transform:none;letter-spacing:0}
.cf.date{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.01em;text-transform:none;color:var(--ink);font-variant-numeric:lining-nums}
.full{position:fixed;left:0;top:0;z-index:20;transform-origin:0 0;will-change:transform}
.full .cardface{position:relative;transform:none;transition:box-shadow .9s}
.full.settled .cardface{box-shadow:0 30px 60px -24px rgba(0,0,0,.6)}

.actions{position:fixed;left:0;right:0;z-index:21;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));visibility:hidden}
.actions > *{opacity:0}
.actions.on{visibility:visible}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:1.5px solid var(--cream);color:var(--cream);background:transparent;cursor:pointer}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.again{background:none;border:0;color:var(--cream);opacity:.75;font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:12px;cursor:pointer;flex-basis:100%}
.skip{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:30;background:rgba(0,0,0,.18);border:1px solid rgba(243,235,221,.35);color:var(--cream);border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
canvas.petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
@media (prefers-reduced-motion:reduce){.tap i,.scene{animation:none}}
</style>

</head>
<body>
<button class="skip" id="skip" type="button">Skip</button>

<main class="stage" id="stage">
  <div class="hint" id="hintTop">A letter for you</div>

  <div class="scene" id="scene">
    <div class="shadow" id="shadow"></div>
    <button class="env" id="env" type="button" aria-label="Open your invitation">
      <div class="flipper" id="flipper">
        <!-- front: the addressed side -->
        <div class="face front" id="front">
          <div class="stamp"><b></b></div>
          <svg class="postmark" viewBox="0 0 120 60" aria-hidden="true">
            <circle cx="88" cy="30" r="24" fill="none" stroke="#5A4A40" stroke-width="1.6"/>
            <text x="88" y="27" text-anchor="middle" font-family="Jost, sans-serif" font-size="7.2" letter-spacing="1" fill="#5A4A40">NEWPORT</text>
            <text x="88" y="38" text-anchor="middle" font-family="Jost, sans-serif" font-size="6.6" letter-spacing=".6" fill="#5A4A40">03·04·27</text>
            <path d="M2 18 q8 -5 16 0 t16 0 t16 0 t12 0 M2 30 q8 -5 16 0 t16 0 t16 0 t12 0 M2 42 q8 -5 16 0 t16 0 t16 0 t12 0" fill="none" stroke="#5A4A40" stroke-width="1.4"/>
          </svg>
          <div class="to">To</div>
          <div class="names" id="names">John &amp; Sarah</div>
          <div class="rule"></div>
          <div class="from">from Kelly &amp; James</div>
        </div>
        <!-- back: flap, seal and the card inside -->
        <div class="face back" id="back">
          <div class="inside"></div>
          <div class="card-in" id="cardIn"></div>
          <svg class="pocket" viewBox="0 0 100 140" preserveAspectRatio="none" aria-hidden="true">
            <polygon points="0,0 52,80 0,140" fill="#F1E8D6"/>
            <polygon points="100,0 48,80 100,140" fill="#EFE5D1"/>
            <polygon points="0,140 50,70 100,140" fill="#F5EDDF"/>
            <polyline points="0,140 50,70 100,140" fill="none" stroke="#D9C9AB" stroke-width=".35"/>
          </svg>
          <div class="flap" id="flap"><div class="o"></div><div class="l"></div></div>
          <div class="seal" id="seal"><span class="a">K&amp;J</span><span class="b">K&amp;J</span></div>
        </div>
      </div>
    </button>
  </div>

  <div class="tap" id="hintTap"><i></i>Tap to open</div>
</main>

<div class="actions" id="actions">
  <a class="btn primary" id="rsvpBtn" href="https://jimmywilson1979-arch.github.io/kelly-james/#rsvp">RSVP</a>
  <a class="btn" id="detailsBtn" href="https://jimmywilson1979-arch.github.io/kelly-james/">Wedding details</a>
  <button class="again" id="again" type="button">Open it again</button>
</div>

<canvas class="petals" id="petals" aria-hidden="true"></canvas>

<template id="cardTpl">
  <div class="cardface" role="img" aria-label="Wedding invitation: Kelly and James, Saturday 3rd April 2027, The Celtic Manor Resort, ceremony at two o'clock, reception to follow, formal attire">
    <svg class="cf" style="top:64px;margin:auto;left:0;right:0;width:46px;height:27px" viewBox="0 0 120 70" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc8c"/><stop offset=".45" stop-color="#d4a23a"/><stop offset=".7" stop-color="#b9842a"/><stop offset="1" stop-color="#efcf7a"/></linearGradient></defs><circle cx="46" cy="42" r="24" fill="none" stroke="url(#gg)" stroke-width="6"/><circle cx="74" cy="42" r="24" fill="none" stroke="url(#gg)" stroke-width="6"/><path d="M80 14 l6 -7 l6 7 l-6 8 z" fill="#fdfdfb" stroke="#c9c9c9" stroke-width=".8"/></svg>
    <div class="cf" style="top:104px">Together with their families</div>
    <div class="cf script" style="top:114px;font-size:42px;line-height:1.2;color:var(--ink)">Kelly <span style="color:var(--rose);font-size:.78em">&amp;</span> James</div>
    <div class="cf" style="top:172px">Request the pleasure of your company<br>at the celebration of their marriage</div>
    <div class="cf date" style="top:212px">Saturday 3rd April 2027</div>
    <div class="cf" style="top:248px">The Celtic Manor Resort<br><span style="font-size:.9em;letter-spacing:.14em">The Golf Club · Newport</span></div>
    <div class="cf" style="top:290px">Ceremony to commence at two o'clock</div>
    <div class="cf script" style="top:304px;font-size:21px;line-height:1.3;color:var(--rose)">Reception to follow</div>
    <div class="cf" style="top:336px;font-size:8px">Formal attire</div>
  </div>
</template>

  // who is this for?  ?code=KJ-XXXXX (live guest)  or  ?to=Name (demo)
  const params = new URLSearchParams(location.search);

  const base = /github\.io$/.test(location.hostname) ? new URL("./", location.href).href : SITE;
  $("rsvpBtn").href = base + (code ? "?code=" + encodeURIComponent(code) : "") + "#rsvp";
  $("detailsBtn").href = base + (code ? "?code=" + encodeURIComponent(code) : "");

  // petals
  const cv = $("petals"), ctx = cv.getContext("2d"); let petalRun = 0;
  function startPetals(){
    if (reduce) return;
    const dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const cols = ["#C8303F","#E05566","#F2C44B","#F7D774","#F3EBDD"];
    const petals = Array.from({length: 30}, () => ({ x: Math.random()*innerWidth, y: -20 - Math.random()*innerHeight*.7, r: 5 + Math.random()*6, vx: -.3 + Math.random()*.6, vy: .6 + Math.random()*1.0, a: Math.random()*6.28, va: -.04 + Math.random()*.08, c: cols[(Math.random()*cols.length)|0] }));

    (function frame(t){
      if (id !== petalRun) return;
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
      const life = t - t0, fade = Math.min(1, life / 600) * Math.max(0, Math.min(1, (9000 - life) / 1500));
      for (const p of petals) { p.x += p.vx + Math.sin(t/700 + p.a)*.4; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.globalAlpha = .85*fade; ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.scale(1, .55 + .45*Math.abs(Math.sin(p.a*1.7)));

  // where the card comes to rest
  function finalBox(){
    const top = 24 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);

    const s = Math.min((innerWidth - 32) / 300, avail / 429, 1.45);

    sizeInner();
    $("flipper").classList.remove("flat"); $("flap").classList.remove("under");
    $("scene").classList.remove("still"); $("scene").style.opacity = "";
    $("hintTop").style.opacity = ""; $("hintTap").style.opacity = "";
    $("actions").classList.remove("on"); $("skip").hidden = false;
    state = "closed";
  }

  $("env").addEventListener("click", open);
  $("skip").addEventListener("click", skip);
  $("again").addEventListener("click", reset);
  addEventListener("resize", () => { sizeInner(); if (full && state === "open") { const b = finalBox(); full.getAnimations().forEach(a => a.cancel()); full.style.transform = `translate(${b.x}px,${b.y}px) scale(${b.s})`; placeActions(b); } });
})();
</script>

</body>
</html>
